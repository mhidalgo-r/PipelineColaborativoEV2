name: Bank Marketing ETL Pipeline
on:
  push:
    branches:
      - feature/pipeline-reportes
  workflow_dispatch:
env:
  PYTHONPATH: ${{ github.workspace }}
jobs:
  etl-pipeline:
    name: ETL Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create .env file
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
      - name: Create directories
        run: |
          mkdir -p data/raw
          mkdir -p data/processed
          mkdir -p data/validated
          mkdir -p data/reject
          mkdir -p logs
      - name: Verify dataset exists
        run: |
          ls -R data
      - name: Run ingestion
        run: python -m scripts.ingest.ingestion_data
      - name: Run cleaning
        run: python -m scripts.cleaning.cleaning_data
      - name: Run transformation
        run: python -m scripts.transform.transform_data
      - name: Run validation
        run: python -m scripts.validation.validation_data
      - name: Run loading
        run: python -m scripts.load.loading_data
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
      - name: Upload processed datasets
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: |
            data/processed/
            data/validated/
            data/reject/
      - name: Pipeline completed
        run: |
          echo "====================================="
          echo "PIPELINE EJECUTADO CORRECTAMENTE"
          echo "====================================="